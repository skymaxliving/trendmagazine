name: Scrape articles

on:
  schedule:
    # Every 2 hours. GitHub's scheduled runs are best-effort (often delayed by
    # hours, sometimes dropped entirely), so we run frequently for redundancy —
    # a missed run is always covered by the next one within 2h, which keeps the
    # site fresh in the morning. Runs are cheap: no new items => exits in seconds.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      maxPerSource:
        description: "Max nových článků na zdroj"
        default: "2"

# Avoid overlapping runs
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run scraper (writes directly to Neon)
        run: pnpm exec tsx scripts/run-scrape.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_DEFAULT_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_MODEL }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          MAX_PER_SOURCE: ${{ github.event.inputs.maxPerSource || '2' }}
          AUTO_PUBLISH: "true"
